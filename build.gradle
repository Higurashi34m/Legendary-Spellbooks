// Plugins
plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin'   version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

// Project
version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

// Minecraft / Forge
minecraft {
    copyIdeResources = true
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory = project.file('run')

            jvmArgs(
                    '-Xmx4G', '-Xms2G',
                    '-XX:+UseG1GC',
                    '-XX:+ParallelRefProcEnabled',
                    '-XX:MaxGCPauseMillis=80',
                    '-XX:+UnlockExperimentalVMOptions',
                    '-XX:+DisableExplicitGC',
                    '-XX:G1NewSizePercent=20',
                    '-XX:G1MaxNewSizePercent=40',
                    '-XX:G1HeapRegionSize=8M',
                    '-XX:G1ReservePercent=20',
                    '-XX:InitiatingHeapOccupancyPercent=15',
                    '-XX:+AlwaysPreTouch',
                    '-XX:+UseStringDeduplication',
                    '-Dfile.encoding=UTF-8'
            )

            property 'forge.logging.markers',           'REGISTRIES'
            property 'forge.logging.console.level',     'debug'
            property 'forge.enabledGameTestNamespaces',  mod_id

            mods { "${mod_id}" { source sourceSets.main } }
        }

        client {
            jvmArgs "-XX:+AllowEnhancedClassRedefinition"
        }

        server {
            workingDirectory = project.file('run/server')
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }

        gameTestServer {
            workingDirectory = project.file("run/gametest")
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Repositories
repositories {
    flatDir {
        dir 'libs'
    }

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }

    // JEI
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    // Iron's
    maven {
        name = "Iron's Maven"
        url = "https://code.redspace.io/releases"
    }

    // Gecko
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    // Curios
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    // PlayerAnimator
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
}

// Dependencies
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI
//    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
//    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Jade
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_version}")

    // Iron's Spells'n Spellbooks
    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}")

    // Iron's Lib
    runtimeOnly fg.deobf("io.redspace:irons_lib:${irons_lib_version}")

    // GeckoLib
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // Curios API
    compileOnly(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api"))
    runtimeOnly(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}"))

    // PlayerAnimator
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")

    // Legendary Monsters
    implementation fg.deobf("curse.maven:legendary-monsters-944035:${legendary_monsters_version}")

    // Wind Spellbooks
    implementation fg.deobf("curse.maven:winds-spellbooks-irons-spells-n-spellbooks-addon-1519158:8018045")

    // Runtime Only
    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    runtimeOnly fg.deobf("curse.maven:modernfix-790626:7515215")
    runtimeOnly fg.deobf("curse.maven:ferritecore-429235:4810975")
    runtimeOnly fg.deobf("curse.maven:fastload-630620:4706149")
    runtimeOnly fg.deobf("curse.maven:radium-reforged-570017:5229844")
    runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:6860192")
    runtimeOnly fg.deobf("curse.maven:selene-499980:7664875")
    runtimeOnly fg.deobf("curse.maven:controlling-250398:4646682")
    runtimeOnly fg.deobf("curse.maven:enchantment-descriptions-250419:7612607")
    runtimeOnly fg.deobf("curse.maven:bookshelf-228525:7612389")
    runtimeOnly fg.deobf("curse.maven:searchables-858542:5284015")
}

// Tasks
tasks.named('processResources', ProcessResources).configure {
    var properties = [
            // Minecraft
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,

            // Forge
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,

            // Mod
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_description        : mod_description,
            mod_url                : mod_url,
            mod_issue              : mod_issue,

            mod_group_id           : mod_group_id,
    ]

    inputs.properties(properties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand(properties)
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set("${mod_id}-${minecraft_version}+forge")
    archiveVersion.set(mod_version)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    from("LICENSE.txt")
}